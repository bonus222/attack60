<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attack60 · 网络攻击与逆向 60 天打卡</title>
<meta name="description" content="零基础到中小企业授权渗透与逆向 triage 的 60 天训练计划：每日任务、验收标准、一手资料、自测与打卡记录。">
<meta name="theme-color" content="#070a0e">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Attack60">
<style>
:root {
  --bg: #070a0e;
  --bg2: #0b1118;
  --panel: #0f1620;
  --panel2: #141d28;
  --line: #1e2b39;
  --line2: #2a3a4c;
  --text: #e8f0f8;
  --dim: #8fa0b3;
  --dim2: #63748a;
  --lime: #a3e635;
  --cyan: #22d3ee;
  --amber: #f59e0b;
  --pink: #f472b6;
  --blue: #38bdf8;
  --danger: #f87171;
  --radius: 16px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background:
    radial-gradient(900px 420px at 15% -10%, rgba(163, 230, 53, .09), transparent 60%),
    radial-gradient(700px 380px at 100% 0%, rgba(34, 211, 238, .08), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100%;
}

body { padding-bottom: calc(78px + env(safe-area-inset-bottom)); }

h1, h2, h3, h4 { margin: 0; line-height: 1.3; font-weight: 700; }
p { margin: 0; }
a { color: var(--cyan); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
.hidden { display: none !important; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: linear-gradient(180deg, rgba(7, 10, 14, .97) 60%, rgba(7, 10, 14, .82));
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(30, 43, 57, .6);
}
.topbar-inner {
  display: flex; align-items: center; gap: 10px;
  max-width: 780px; margin: 0 auto; padding: 12px 16px;
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand img { width: 34px; height: 34px; border-radius: 9px; }
.brand h1 { font-size: 16px; letter-spacing: .3px; }
.brand p { font-size: 11px; color: var(--dim2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  width: 38px; height: 38px; display: grid; place-items: center;
  border-radius: 11px; border: 1px solid var(--line); background: var(--panel);
  color: var(--dim); flex: none;
}
.icon-btn:active { transform: scale(.95); }
.icon-btn svg { width: 18px; height: 18px; }

.searchbar {
  position: sticky; top: 62px; z-index: 39;
  background: rgba(7, 10, 14, .97); backdrop-filter: blur(14px);
}
.searchbar-inner { max-width: 780px; margin: 0 auto; padding: 0 16px 10px; }
.searchbar input {
  width: 100%; padding: 12px 14px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line2); outline: none;
}
.searchbar input:focus { border-color: var(--lime); }
.search-results { max-height: 55vh; overflow: auto; margin-top: 8px; }
.sr-item {
  display: block; width: 100%; text-align: left; padding: 10px 12px;
  border-radius: 10px; border: 1px solid transparent;
}
.sr-item:hover, .sr-item:focus { background: var(--panel); border-color: var(--line); }
.sr-item b { color: var(--lime); font-weight: 600; }
.sr-item small { display: block; color: var(--dim2); font-size: 12px; }

/* ---------- layout ---------- */
.app { max-width: 780px; margin: 0 auto; padding: 16px 16px 24px; }
.view { display: none; animation: fade .18s ease; }
.view.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.card {
  background: linear-gradient(180deg, var(--panel), #0d141d);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card > h3 { font-size: 14px; color: var(--dim); letter-spacing: .4px; margin-bottom: 10px; font-weight: 600; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.card-head h3 { font-size: 14px; color: var(--dim); font-weight: 600; letter-spacing: .4px; }
.card-head span { font-size: 12px; color: var(--dim2); font-variant-numeric: tabular-nums; }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; }
.hero::after {
  content: ""; position: absolute; inset: auto -40% -60% auto; width: 320px; height: 320px;
  background: radial-gradient(circle, rgba(163, 230, 53, .12), transparent 65%);
  pointer-events: none;
}
.hero-top { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; }
.eyebrow { font-size: 12px; color: var(--dim2); letter-spacing: .6px; margin-bottom: 6px; }
.hero h2 { font-size: 21px; margin-bottom: 10px; letter-spacing: .2px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px; font-size: 11.5px;
  color: var(--c, var(--lime));
  border: 1px solid rgba(163, 230, 53, .38);
  background: rgba(163, 230, 53, .1);
  border: 1px solid color-mix(in srgb, var(--c, var(--lime)) 40%, transparent);
  background: color-mix(in srgb, var(--c, var(--lime)) 12%, transparent);
  white-space: nowrap;
}
.chip.ghost { --c: var(--dim2); border-color: var(--line2); background: rgba(255, 255, 255, .02); }
.focus {
  margin-top: 14px; padding-left: 11px; border-left: 2px solid var(--lime);
  color: #c9d6e4; font-size: 14px;
}

/* progress ring */
.ring { position: relative; width: 66px; height: 66px; flex: none; }
.ring svg { transform: rotate(-90deg); width: 66px; height: 66px; }
.ring circle { fill: none; stroke-width: 5; }
.ring .bg { stroke: #1a2634; }
.ring .fg { stroke: var(--lime); stroke-linecap: round; transition: stroke-dashoffset .4s; }
.ring span {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
}

/* ---------- tasks ---------- */
.tasks { list-style: none; margin: 0; padding: 0; }
.task {
  display: flex; gap: 11px; align-items: flex-start;
  padding: 11px 0; border-bottom: 1px dashed rgba(42, 58, 76, .55);
}
.task:last-child { border-bottom: 0; padding-bottom: 2px; }
.tick {
  flex: none; width: 22px; height: 22px; margin-top: 1px;
  border-radius: 7px; border: 1.5px solid var(--line2);
  display: grid; place-items: center; color: transparent; transition: .15s;
}
.tick svg { width: 13px; height: 13px; }
.task.done .tick { background: var(--lime); border-color: var(--lime); color: #0a0f14; }
.task.done .ttext { color: var(--dim2); text-decoration: line-through; text-decoration-color: rgba(143, 160, 179, .5); }
.ttext { font-size: 14.5px; line-height: 1.55; }

/* ---------- resources ---------- */
.res-links { display: flex; flex-direction: column; gap: 8px; }
.res-link {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 11px;
  background: var(--panel2); border: 1px solid var(--line);
}
.res-link:hover { border-color: var(--line2); text-decoration: none; }
.res-link .rname { flex: 1; min-width: 0; font-size: 14px; }
.res-link .rbadge { font-size: 10.5px; color: var(--dim2); border: 1px solid var(--line2); padding: 1px 7px; border-radius: 999px; flex: none; }
.res-link small { display: block; color: var(--dim2); font-size: 11.5px; margin-top: 2px; }

/* ---------- accept / note ---------- */
.accept { border-color: rgba(163, 230, 53, .28); background: linear-gradient(180deg, rgba(163, 230, 53, .06), #0d141d); }
.accept h3 { color: var(--lime); }
.accept p { font-size: 14px; color: #d3e0ec; }
textarea.note {
  width: 100%; min-height: 96px; resize: vertical;
  background: #0a1017; border: 1px solid var(--line); border-radius: 11px;
  padding: 11px 12px; outline: none; font-size: 14px; line-height: 1.6;
}
textarea.note:focus { border-color: var(--lime); }

/* ---------- check-in ---------- */
.checkin-row { display: flex; align-items: stretch; gap: 10px; }
.checkin-row .mins {
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 13px; background: var(--panel2);
  font-size: 12px; color: var(--dim2); flex: none;
}
.checkin-row .mins input {
  width: 58px; background: none; border: none; outline: none;
  font-size: 15px; color: var(--text); text-align: right; font-variant-numeric: tabular-nums;
}
.btn {
  flex: 1; padding: 14px 18px; border-radius: 13px;
  background: var(--lime); color: #0a0f14; font-weight: 700; font-size: 15px;
  border: 1px solid var(--lime);
}
.btn:active { transform: scale(.99); }
.btn.ghost { background: var(--panel2); color: var(--text); border-color: var(--line2); font-weight: 600; }
.btn.danger { background: var(--panel2); color: var(--danger); border-color: rgba(248, 113, 113, .4); font-weight: 600; }
.btn.small { flex: none; padding: 8px 12px; font-size: 12.5px; border-radius: 10px; font-weight: 600; }
.checked-badge {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  border-radius: 13px; background: rgba(163, 230, 53, .08);
  border: 1px solid rgba(163, 230, 53, .3); font-size: 13.5px;
}
.checked-badge b { color: var(--lime); }

/* ---------- heatmap ---------- */
.heat-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.heat-head h3 { font-size: 14px; color: var(--dim); font-weight: 600; }
.heat-head span { font-size: 11.5px; color: var(--dim2); }
.heat {
  display: grid; grid-template-rows: repeat(7, 11px);
  grid-auto-flow: column; grid-auto-columns: 11px; gap: 4px;
  overflow-x: auto; padding-bottom: 4px;
}
.heat i { width: 11px; height: 11px; border-radius: 3px; background: #131c26; display: block; }
.heat i[data-v="1"] { background: rgba(163, 230, 53, .28); }
.heat i[data-v="2"] { background: rgba(163, 230, 53, .55); }
.heat i[data-v="3"] { background: rgba(163, 230, 53, .8); }
.heat i[data-v="4"] { background: var(--lime); }
.heat .today { outline: 1px solid var(--dim2); outline-offset: 1px; }

/* ---------- plan ---------- */
.week { padding: 0; overflow: hidden; }
.week-head {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; text-align: left;
}
.week-head .wnum {
  flex: none; width: 30px; height: 30px; border-radius: 9px;
  display: grid; place-items: center; font-size: 12.5px; font-weight: 700;
  background: var(--panel2); border: 1px solid var(--line2); color: var(--dim);
}
.week-head .wtxt { flex: 1; min-width: 0; }
.week-head .wtxt b { display: block; font-size: 14.5px; font-weight: 600; }
.week-head .wtxt small { color: var(--dim2); font-size: 11.5px; }
.week-head .wstat { font-size: 11.5px; color: var(--dim2); font-variant-numeric: tabular-nums; flex: none; }
.week-body { display: none; padding: 0 16px 12px; }
.week.open .week-body { display: block; }
.week-goal { font-size: 12.5px; color: var(--dim); padding: 0 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.day-row {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 9px 6px; border-radius: 9px; text-align: left;
}
.day-row:hover { background: var(--panel2); }
.day-row .dnum { font-size: 11px; color: var(--dim2); width: 20px; font-variant-numeric: tabular-nums; flex: none; }
.day-row .dt { flex: 1; font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-row .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line2); flex: none; }
.day-row .dot.done { background: var(--lime); box-shadow: 0 0 8px rgba(163, 230, 53, .6); }
.day-row .dot.part { background: var(--amber); }

/* ---------- tabs ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  background: rgba(10, 15, 21, .97); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
}
.tabbar-inner {
  display: flex; justify-content: space-around;
  max-width: 780px; margin: 0 auto;
  padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 4px 0; color: var(--dim2); font-size: 10.5px; border-radius: 10px;
}
.tab svg { width: 21px; height: 21px; }
.tab.active { color: var(--lime); }
.tab:active { transform: scale(.96); }

/* ---------- quiz ---------- */
.quiz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.quiz-top .qbar { flex: 1; height: 5px; border-radius: 99px; background: #16202b; margin-left: 12px; overflow: hidden; }
.quiz-top .qbar i { display: block; height: 100%; background: var(--lime); transition: width .25s; }
.qtext { font-size: 16.5px; font-weight: 600; line-height: 1.5; margin-bottom: 14px; }
.opts { display: flex; flex-direction: column; gap: 9px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 13px 14px; border-radius: 12px; text-align: left;
  background: var(--panel2); border: 1px solid var(--line); font-size: 14px;
}
.opt .k {
  flex: none; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center;
  font-size: 11px; color: var(--dim2); border: 1px solid var(--line2); margin-top: 1px;
}
.opt.correct { border-color: rgba(163, 230, 53, .6); background: rgba(163, 230, 53, .09); }
.opt.correct .k { background: var(--lime); color: #0a0f14; border-color: var(--lime); }
.opt.wrong { border-color: rgba(248, 113, 113, .55); background: rgba(248, 113, 113, .08); }
.opt.wrong .k { background: rgba(248, 113, 113, .2); color: var(--danger); border-color: rgba(248, 113, 113, .5); }
.opt:disabled { cursor: default; }
.explain {
  margin-top: 14px; padding: 12px 13px; border-radius: 11px;
  background: #0a1017; border-left: 2px solid var(--cyan);
  font-size: 13.5px; color: #c3d2e0;
}
.quiz-result { text-align: center; padding: 8px 0 4px; }
.quiz-result .big { font-size: 42px; font-weight: 800; color: var(--lime); line-height: 1.1; }
.quiz-result .sub { color: var(--dim); font-size: 13px; margin: 6px 0 16px; }
.wrong-list { text-align: left; margin-top: 10px; }
.wrong-list li { font-size: 13px; color: var(--dim); margin-bottom: 10px; }
.wrong-list li b { color: var(--text); font-weight: 600; display: block; }
.wrong-list li span { color: var(--lime); }

/* ---------- misc ---------- */
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  padding: 8px 13px; border-radius: 10px; font-size: 12.5px;
  border: 1px solid var(--line2); background: var(--panel2); color: var(--dim);
}
.seg button.on { background: rgba(163, 230, 53, .12); border-color: rgba(163, 230, 53, .5); color: var(--lime); }

.searchrow { display: flex; gap: 8px; }
.searchrow input {
  flex: 1; padding: 11px 13px; border-radius: 11px; outline: none;
  background: #0a1017; border: 1px solid var(--line);
}
.searchrow input:focus { border-color: var(--lime); }
.engines { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.engines a {
  padding: 7px 12px; border-radius: 9px; font-size: 12.5px;
  border: 1px solid var(--line2); color: var(--dim); background: var(--panel2);
}
.engines a:hover { color: var(--lime); border-color: rgba(163, 230, 53, .5); text-decoration: none; }
.quick { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
.quick button {
  padding: 6px 10px; border-radius: 8px; font-size: 11.5px;
  border: 1px dashed var(--line2); color: var(--dim2);
}

.rubric-item { padding: 12px 0; border-bottom: 1px dashed rgba(42, 58, 76, .6); }
.rubric-item:last-child { border-bottom: 0; }
.rubric-item p { font-size: 13.5px; margin-bottom: 8px; }
.rubric-item .seg button { padding: 5px 12px; font-size: 12px; }

.dir {
  padding: 14px; border-radius: 13px; border: 1px solid var(--line);
  background: var(--panel2); margin-bottom: 10px;
}
.dir.reco { border-color: rgba(163, 230, 53, .5); background: linear-gradient(180deg, rgba(163, 230, 53, .07), var(--panel2)); }
.dir h4 { font-size: 14.5px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.dir .tag { font-size: 10px; color: var(--lime); border: 1px solid rgba(163, 230, 53, .4); padding: 1px 7px; border-radius: 99px; }
.dir p { font-size: 13px; color: var(--dim); }
.dir .meta { font-size: 11.5px; color: var(--dim2); margin-top: 8px; }

.score-box { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 14px; }
.score-box .n { font-size: 34px; font-weight: 800; color: var(--lime); line-height: 1; }
.score-box .lv { font-size: 13px; color: var(--dim); }

.data-row { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 10px; }
.data-row .btn { flex: 1; min-width: 130px; padding: 12px; font-size: 13.5px; }

.foot { text-align: center; font-size: 11.5px; color: var(--dim2); padding: 18px 0 8px; line-height: 1.7; }

.toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(12px);
  background: #16202b; color: var(--text); border: 1px solid var(--line2);
  padding: 10px 16px; border-radius: 11px; font-size: 13px; z-index: 99;
  opacity: 0; transition: .22s; pointer-events: none; box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.daynav { display: flex; gap: 9px; margin-top: 4px; }
.daynav .btn { padding: 11px; font-size: 13px; }

@media (min-width: 720px) {
  .app { padding: 20px 20px 40px; }
  .hero h2 { font-size: 24px; }
  .heat { gap: 5px; }
  .heat i { width: 13px; height: 13px; }
  .heat { grid-template-rows: repeat(7, 13px); grid-auto-columns: 13px; }
}

@media print {
  .topbar, .tabbar, .searchbar, .daynav, .checkin-row, .toast { display: none !important; }
  body { background: #fff; color: #000; }
  .card { box-shadow: none; border-color: #ccc; background: #fff; }
  .view { display: block !important; }
}

</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
  <div class="brand">
    <img src="icon-192.png" alt="">
    <div>
      <h1>Attack60</h1>
      <p>网络攻击与逆向 · 60 天基线</p>
    </div>
  </div>
  <button class="icon-btn" id="searchToggle" aria-label="搜索" title="搜索">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  </button>
  <button class="icon-btn" id="dataToggle" aria-label="数据与设置" title="数据与设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
  </button>
  </div>
</header>

<div class="searchbar hidden" id="searchBar">
  <div class="searchbar-inner">
    <input id="searchInput" type="search" placeholder="搜任务 / 资源 / 技术名，例如 SQLi、Kerberos" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<main class="app">
  <section class="view active" id="view-today"></section>

  { w: 1, q: "nmap -sS 通常需要 root 权限，原因是？", o: ["需要读取 /etc/shadow", "需要构造原始 TCP 包，不完成握手", "需要连接数据库", "需要关闭防火墙"], a: 1, e: "-sS 自己构造 TCP 头、只收 SYN-ACK，因此需要原始套接字；好处是快且不易被应用层记录。" },

  /* 第 2 周 · 方法论与 Web 基础 */
  { w: 2, q: "一次正规渗透测试开始前，第一步应该是？", o: ["直接扫描目标端口", "确认授权范围与规则（RoE）", "先想办法拿 shell", "先写报告模板"], a: 1, e: "没有书面授权与范围界定的测试，性质上就不是渗透测试。这一步决定后面所有动作的合法性。" },
  { w: 2, q: "Burp Suite 中用于重放并修改单个请求的模块是？", o: ["Proxy", "Repeater", "Intruder", "Decoder"], a: 1, e: "Repeater 是手工验证的主战场：改一个参数、发一次、看差异。" },
  { w: 2, q: "SQL 注入最根本的修复方式是？", o: ["过滤单引号", "关闭错误回显", "使用参数化查询（预编译）", "加 WAF"], a: 2, e: "参数化查询把数据与语句分离，从根上消除拼接；过滤与 WAF 都只是缓解。" },
  { w: 2, q: "防御 XSS 最关键的思路是？", o: ["过滤 script 标签", "按输出上下文做编码", "禁用 JavaScript", "只允许 GET 请求"], a: 1, e: "同一个值在 HTML、属性、JS、URL 里需要不同编码。黑名单过滤总能被绕过。" },
  { w: 2, q: "SameSite=Lax 的 Cookie 在哪种跨站请求中仍会发送？", o: ["跨站 POST 表单", "跨站顶级导航的 GET（如点击链接）", "跨站 fetch 请求", "任何跨站请求都不发送"], a: 1, e: "Lax 允许顶级导航的 GET 携带 Cookie，所以对 GET 型敏感操作（如改密码链接）依然有 CSRF 风险。" },

  /* 第 3 周 · Web 漏洞 */
  { w: 3, q: "文件上传功能最可靠的防御组合是？", o: ["只过滤 .php 后缀", "白名单扩展名 + 重命名 + 存到非 Web 目录", "只检查 Content-Type", "只限制文件大小"], a: 1, e: "三层叠加：能不能传、传上来叫什么、能不能被解析。任何单层都能被绕过。" },
  { w: 3, q: "SSRF 在云环境中最常被读取的元数据地址是？", o: ["127.0.0.1", "169.254.169.254", "10.0.0.1", "224.0.0.1"], a: 1, e: "链路本地地址上的实例元数据服务，常能拿到临时凭证，是 SSRF 的最高价值目标。" },
  { w: 3, q: "防御 XXE 最直接的做法是？", o: ["禁用外部实体解析", "过滤 < 和 >", "只允许 UTF-8", "关闭 HTTP 服务"], a: 0, e: "解析器层面关掉 DTD/外部实体，而不是靠字符串过滤。" },
  { w: 3, q: "IDOR（越权访问对象）的根因是？", o: ["用户密码太弱", "服务端缺少对对象归属的授权校验", "没有使用 HTTPS", "Cookie 未加密"], a: 1, e: "它本质是授权缺陷：认证只回答你是谁，不回答这个对象是不是你的。" },
  { w: 3, q: "JWT 中 alg=none 的风险是？", o: ["令牌永不过期", "服务端可能接受未签名的令牌", "令牌无法被解码", "令牌体积变大"], a: 1, e: "若服务端信任头部里的算法，攻击者可以把 alg 改成 none 并伪造任意声明。" },

  /* 第 4 周 · Windows 与 AD */
  { w: 4, q: "Kerberoasting 攻击的目标是？", o: ["域控的 krbtgt 哈希", "带 SPN 的服务账号的 TGS 票据", "用户的明文密码", "AD 数据库文件"], a: 1, e: "任何域用户都能请求服务票据，票据用服务账号哈希加密，可离线暴力破解，且不触发账号锁定。" },
  { w: 4, q: "AS-REP Roasting 能成功的前提是？", o: ["账号属于 Domain Admins", "账号关闭了 Kerberos 预认证", "域控未打补丁", "开启了 SMB 签名"], a: 1, e: "关闭预认证后，任何人都能拿到用该账号哈希加密的 AS-REP，从而离线破解。" },
  { w: 4, q: "BloodHound 的核心数据来源是？", o: ["端口扫描结果", "域内 ACL、会话、委派等关系数据", "DNS 记录", "防火墙规则"], a: 1, e: "它把域内的权限关系建成图，攻击路径就是图上从你到 Domain Admins 的一条边序列。" },
  { w: 4, q: "缓解 NTLM Relay 最有效的措施是？", o: ["禁用 IPv6", "启用 SMB/LDAP 签名与 EPA，并逐步禁用 NTLM", "修改域控 IP", "关闭 DNS"], a: 1, e: "中继的前提是协议不校验通道。签名与 EPA 让中继失效，禁用 NTLM 是终局方案。" },
  { w: 4, q: "执行 DCSync 需要的关键权限是？", o: ["Domain Users", "目录复制权限（Replicating Directory Changes）", "本地管理员", "远程桌面登录"], a: 1, e: "DCSync 伪装成域控向真实域控同步数据，因此需要复制权限；这也是为什么该权限被重点监控。" },

  /* 第 5 周 · 内网与检测 */
  { w: 5, q: "Pass-the-Hash 直接使用的是？", o: ["明文密码", "NTLM 哈希", "Kerberos 票据", "客户端证书"], a: 1, e: "NTLM 认证只需要哈希，不需要明文，所以抓不到明文也能横向。" },
  { w: 5, q: "伪造 Golden Ticket 需要拿到什么？", o: ["域管理员密码", "krbtgt 账号的哈希", "任意普通用户的哈希", "CA 私钥"], a: 1, e: "krbtgt 哈希用来签发任意 TGT；因此它一旦泄露，等于整个域失守，必须双次重置。" },
  { w: 5, q: "Ligolo-ng 相比 proxychains 的主要优势是？", o: ["不需要代理", "建立 TUN 接口，nmap 等工具可像本地网络一样扫描", "只能用于 Windows", "自带免杀能力"], a: 1, e: "TUN 模式让工具无需支持 SOCKS，扫描与利用都更稳定。" },
  { w: 5, q: "在 Linux 上查找 SUID 程序的命令是？", o: ["find / -perm -4000", "ls -l /etc", "ps aux", "netstat -tunlp"], a: 0, e: "SUID 位对应的八进制是 4000，配合 -type f 更精确。" },
  { w: 5, q: "Sysmon 的 Event ID 1 记录的是？", o: ["网络连接", "进程创建", "文件创建", "注册表修改"], a: 1, e: "ID 1 进程创建（含命令行与父进程），是检测攻击链最重要的事件源。" },

  /* 第 6 周 · 汇编与 PE */
  { w: 6, q: "Windows x64 调用约定中，前四个整型参数依次放在？", o: ["rax rbx rcx rdx", "rcx rdx r8 r9", "rsp rbp rsi rdi", "r8 r9 r10 r11"], a: 1, e: "这是 Windows x64 的约定；Linux 用 rdi rsi rdx rcx r8 r9，别混。" },
  { w: 6, q: "x64 函数返回值通常放在？", o: ["rax", "rbx", "rcx", "rdx"], a: 0, e: "看调用后的 rax 就能知道返回结果，这是读汇编最常用的判断点。" },
  { w: 6, q: "x86/x64 的栈增长方向是？", o: ["向高地址", "向低地址", "随机", "由编译器决定"], a: 1, e: "push 使 rsp 减小。理解这一点才能看懂栈帧与局部变量偏移。" },
  { w: 6, q: "PE 头中的 AddressOfEntryPoint 是？", o: ["文件偏移", "RVA（相对虚拟地址）", "节区索引", "导入表下标"], a: 1, e: "需要按节表换算成文件偏移，才能定位到磁盘上的入口字节。" },
  { w: 6, q: "PE 某节区熵接近 8.0，最可能说明？", o: ["该节区是普通代码", "数据被压缩或加密（可能加壳）", "文件已损坏", "是调试符号"], a: 1, e: "熵接近上限说明数据接近随机，常见于加壳或加密载荷。" },

  /* 第 7 周 · 样本分析 */
  { w: 7, q: "capa 的主要作用是？", o: ["脱壳", "识别样本能力并映射到 MITRE ATT&CK", "内存取证", "抓包分析"], a: 1, e: "capa 用规则匹配反汇编与导入表，快速回答这个样本具备什么能力。" },
  { w: 7, q: "UPX 属于哪类工具？", o: ["调试器", "可执行文件压缩壳", "反编译器", "沙箱"], a: 1, e: "UPX 压缩可执行文件并附带解压存根，脱壳要先到 OEP 再 dump。" },
  { w: 7, q: "下列哪个是常见的反调试 API？", o: ["CreateFile", "IsDebuggerPresent", "GetSystemTime", "LoadLibrary"], a: 1, e: "它查询 PEB 的 BeingDebugged 标志；对抗方式包括改标志、下手写异常等。" },
  { w: 7, q: "Volatility3 的 malfind 插件用于？", o: ["列出进程", "查找内存中注入或可疑的可执行代码", "提取注册表", "解析网络包"], a: 1, e: "malfind 找无文件映射、可执行且可疑的内存区，是发现注入的第一步。" },
  { w: 7, q: "分析恶意样本前最重要的一步是？", o: ["先上传 VirusTotal", "在隔离虚拟机中做快照并断网", "先运行看效果", "先改文件后缀"], a: 1, e: "样本可能横向传播或加密文件。快照 + 断网 + 只读共享是底线。" },

  /* 第 8 周 · 交付 */
  { w: 8, q: "报告的执行摘要主要给谁看？", o: ["渗透测试工程师", "管理层与非技术决策者", "开发人员", "审计机构"], a: 1, e: "决策者只关心三件事：有多大风险、会不会影响业务、要花多少资源修。" },
  { w: 8, q: "CVSS 分数描述的是？", o: ["漏洞利用难度", "漏洞严重性（影响与可利用性综合）", "修复成本", "攻击者身份"], a: 1, e: "它是严重性评分，不等于业务风险；业务风险还要叠加资产重要性与暴露面。" },
  { w: 8, q: "一份渗透报告里最能体现专业度的是？", o: ["用了多少种工具", "可复现步骤、影响说明与可执行修复建议", "截图数量", "漏洞数量"], a: 1, e: "客户要能照着复现、照着修。工具清单不产生价值。" },
  { w: 8, q: "复测（retest）的核心目的是？", o: ["再收一次费用", "验证修复是否有效并评估残余风险", "找新漏洞", "写新报告"], a: 1, e: "复测关闭的是风险，不是工单。" },
  { w: 8, q: "授权项目中，你发现生产数据库里有客户数据，正确做法是？", o: ["导出留证", "立即停止触碰，按 RoE 上报，只记录必要证据", "删除数据", "发给同事围观"], a: 1, e: "最小必要原则：能证明漏洞存在即可，绝不扩大数据接触面。" },

  /* 第 9 周 · 职业与深造 */
  { w: 9, q: "OSCP（PEN-200）考试形式是？", o: ["100 道选择题", "24 小时实操 + 报告", "48 小时写论文", "现场答辩"], a: 1, e: "24 小时内攻破多台目标并提交渗透报告，考的是流程稳定性而非炫技。" },
  { w: 9, q: "eJPT 的定位是？", o: ["专家级红队认证", "入门级实操认证", "逆向专项认证", "云安全专项认证"], a: 1, e: "适合作为第一个证书，验证你具备完整的入门实操链路。" },
  { w: 9, q: "CRTO 更侧重？", o: ["Web 漏洞", "红队运营与 C2 使用", "逆向工程", "合规审计"], a: 1, e: "CRTO 关注真实红队作业方式：基础设施、C2、OPSEC。" },
  { w: 9, q: "OSED 更侧重？", o: ["漏洞利用开发与逆向", "AD 渗透", "报告写作", "云安全"], a: 0, e: "OSED 考的是写 exploit、绕过缓解机制，属于逆向与二进制方向的进阶。" },
  { w: 9, q: "中小企业安全建设，通常最先该补的是？", o: ["买最贵的 EDR", "资产盘点与边界暴露面收敛", "自建 SOC", "全员渗透培训"], a: 1, e: "不知道自己有什么资产，后面的检测与响应都无从谈起。" }
];

</script>
<script>
/* Attack60 前端逻辑：打卡、路线、资源、自测、深造、数据 */
(function () {
  'use strict';

  var P = window.PLAN, R = window.RESOURCES, Q = window.QUIZ;
  var DAYS = P.days;
  var RES = {};
  R.forEach(function (r) { RES[r.id] = r; });

  var KEY = 'attack60.v1';
  var TOTAL_TASKS = DAYS.reduce(function (n, d) { return n + d.k.length; }, 0);
  var CIRC = 2 * Math.PI * 28;

  /* ---------------- 工具 ---------------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayISO() { return isoDate(new Date()); }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
  function pct(n) { return Math.round(n * 100); }

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  /* ---------------- 状态 ---------------- */
  function defaultState() {
    return { v: 1, view: 'today', day: 1, days: {}, quiz: { log: [] }, rubric: {}, created: todayISO() };
  }
  var S;
  try {
    var raw = localStorage.getItem(KEY);
    S = raw ? JSON.parse(raw) : null;
  } catch (e) { S = null; }
  if (!S || S.v !== 1) S = defaultState();
  S.days = S.days || {};
  S.quiz = S.quiz || { log: [] };
  S.rubric = S.rubric || {};

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 隐私模式下静默失败 */ }
  }
  function rec(d) { return S.days[d] || null; }
  function ensure(d) {
    if (!S.days[d]) S.days[d] = { at: null, done: [], min: 180, note: '' };
    return S.days[d];
  }
  function doneCount(d) { return rec(d) ? rec(d).done.length : 0; }
  function currentDay() {
    for (var i = 1; i <= 60; i++) { if (!rec(i) || !rec(i).at) return i; }
    return 60;
  }
  function totalDone() {
    return Object.keys(S.days).reduce(function (n, k) { return n + (S.days[k].done || []).length; }, 0);
  }
  function streak() {
    var set = {};
    Object.keys(S.days).forEach(function (k) { if (S.days[k].at) set[S.days[k].at] = 1; });
    var cur = new Date();
    if (!set[isoDate(cur)]) cur.setDate(cur.getDate() - 1);
    var n = 0;
    while (set[isoDate(cur)]) { n++; cur.setDate(cur.getDate() - 1); }
    return n;
  }

  /* ---------------- 视图切换 ---------------- */
  function go(view, day) {
    S.view = view;
    if (day) S.day = clamp(day, 1, 60);
    save();
    render();
    window.scrollTo(0, 0);
  }
  function render() {
    var boxes = document.querySelectorAll('.view');
    for (var i = 0; i < boxes.length; i++) boxes[i].classList.remove('active');
    var el = document.getElementById('view-' + S.view);
    if (!el) { S.view = 'today'; el = document.getElementById('view-today'); }
    el.classList.add('active');
    var map = { today: renderToday, plan: renderPlan, res: renderRes, quiz: renderQuizView, lab: renderLab, data: renderData };
    (map[S.view] || renderToday)();
    var tabs = document.querySelectorAll('.tab');
    for (var j = 0; j < tabs.length; j++) tabs[j].classList.toggle('active', tabs[j].dataset.view === S.view);
  }

  /* ---------------- 今日 ---------------- */
  function ringSVG(p) {
    var off = CIRC * (1 - p);
    return '<svg viewBox="0 0 66 66"><circle class="bg" cx="33" cy="33" r="28"></circle>' +
      '<circle class="fg" cx="33" cy="33" r="28" stroke-dasharray="' + CIRC.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"></circle></svg>' +
      '<span>' + pct(p) + '%</span>';
  }

  function renderToday() {
    var d = clamp(S.day, 1, 60);
    var day = DAYS[d - 1];
    var ph = P.phases[day.p];
    var r = rec(d);
    var done = doneCount(d);
    var p = done / day.k.length;

    var h = '';
    h += '<div class="hero card"><div class="hero-top"><div style="min-width:0">';
    h += '<div class="eyebrow">第 ' + d + ' 天 / 60 · 第 ' + day.w + ' 周' + (d === currentDay() ? ' · 当前进度' : ' · 回顾/预习') + '</div>';
    h += '<h2>' + esc(day.t) + '</h2>';
    h += '<div class="chip-row"><span class="chip" style="--c:' + ph.color + '">' + esc(ph.name) + '</span>';
    h += '<span class="chip ghost">' + day.k.length + ' 个任务</span><span class="chip ghost">约 3 小时</span>';
    if (r && r.at) h += '<span class="chip" style="--c:var(--lime)">已打卡 ' + esc(r.at) + '</span>';
    h += '</div></div><div class="ring" id="ring">' + ringSVG(p) + '</div></div>';
    h += '<p class="focus">' + esc(day.f) + '</p></div>';

    h += '<div class="card"><div class="card-head"><h3>今日任务</h3><span id="taskCount">' + done + '/' + day.k.length + '</span></div><ul class="tasks">';
    day.k.forEach(function (t, i) {
      var on = r && r.done.indexOf(i) >= 0;
      h += '<li class="task' + (on ? ' done' : '') + '" data-i="' + i + '">';
      h += '<button class="tick" data-act="toggle" data-i="' + i + '" aria-label="标记完成">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></button>';
      h += '<span class="ttext">' + esc(t) + '</span></li>';
    });
    h += '</ul></div>';

    if (day.r && day.r.length) {
      h += '<div class="card"><h3>一手材料</h3><div class="res-links">';
      day.r.forEach(function (id) {
        var x = RES[id];
        if (!x) return;
        h += '<a class="res-link" href="' + esc(x.u) + '" target="_blank" rel="noopener">' +
          '<span class="rname">' + esc(x.n) + '<small>' + esc(x.note) + '</small></span>' +
          '<span class="rbadge">' + esc(x.tier) + '</span></a>';
      });
      h += '</div></div>';
    }

    h += '<div class="card accept"><h3>验收标准</h3><p>' + esc(day.a) + '</p></div>';

    h += '<div class="card"><div class="card-head"><h3>笔记 / 卡点</h3><span id="noteStatus">自动保存</span></div>' +
      '<textarea class="note" id="noteInput" placeholder="今天卡在哪一步？下次怎么更快？">' + esc((r && r.note) || '') + '</textarea></div>';

    h += '<div class="card" id="checkinBox">' + checkinHTML(d) + '</div>';

    h += '<div class="card"><div class="heat-head"><h3>打卡记录 · 近 10 周</h3><span id="streakTxt">连续 ' + streak() + ' 天 · 累计 ' + totalDone() + '/' + TOTAL_TASKS + '</span></div>' +
      '<div class="heat" id="heat">' + heatHTML() + '</div></div>';

    h += '<div class="daynav">';
    h += '<button class="btn ghost" data-act="prev"' + (d <= 1 ? ' disabled' : '') + '>上一天</button>';
    if (d !== currentDay()) h += '<button class="btn ghost" data-act="jump">回到第 ' + currentDay() + ' 天</button>';

      '<input type="file" id="fileInput" accept="application/json,.json" class="hidden"></div>';

    h += '<div class="card"><h3>安装到手机（推荐）</h3>' +
      '<p style="color:var(--dim);font-size:13px;line-height:1.75">iPhone：Safari 打开 → 分享 → 添加到主屏幕。<br>Android：Chrome 打开 → 菜单 → 安装应用 / 添加到主屏幕。<br>安装后可离线打开，打卡记录保存在本机。</p>' +
      '<button class="btn ghost" style="margin-top:12px" data-act="install" id="installBtn">安装到此设备</button></div>';

    h += '<div class="card"><h3>关于成绩的第三方证明</h3>' +
      '<p style="color:var(--dim);font-size:13px;line-height:1.8">自评不算数。能证明你的只有：靶场判分（HTB/THM/PortSwigger 实验完成记录）、CTFtime 排名、公开 writeup 被引用、证书、以及蓝队检测是否命中你的攻击。</p></div>';

    h += '<div class="card"><h3>使用边界</h3>' +
      '<p style="color:var(--dim);font-size:13px;line-height:1.8">本程序只提供学习路线。所有技术练习必须在自有虚拟机或明确授权的平台内进行。未经授权对他人系统进行扫描、入侵、数据获取，在中国境内可能触犯《网络安全法》与《刑法》第二百八十五、二百八十六条。</p></div>';

    h += '<p class="foot">Attack60 v' + esc(P.meta.version) + ' · ' + TOTAL_TASKS + ' 个任务 · 数据存于本机 localStorage<br>建议每周导出一次备份</p>';
    document.getElementById('view-data').innerHTML = h;
  }

  /* ---------------- 搜索 ---------------- */
  var IDX = [];
  DAYS.forEach(function (d) {
    IDX.push({ type: 'day', d: d.d, s: '第' + d.d + '天 ' + d.t + ' ' + d.f + ' ' + d.k.join(' ') + ' 第' + d.w + '周', label: '第 ' + d.d + ' 天 · ' + d.t });
  });
  R.forEach(function (r) {
    IDX.push({ type: 'res', url: r.u, s: r.n + ' ' + r.note + ' ' + r.tier, label: r.n, sub: r.note });
  });

  function doSearch(q) {
    var box = document.getElementById('searchResults');
    q = q.trim().toLowerCase();
    if (!q) { box.innerHTML = ''; return; }
    var hits = IDX.filter(function (x) { return x.s.toLowerCase().indexOf(q) >= 0; }).slice(0, 18);
    if (!hits.length) { box.innerHTML = '<p style="color:var(--dim2);font-size:13px;padding:8px 4px">没有结果，试试英文关键词。</p>'; return; }
    box.innerHTML = hits.map(function (x) {
      if (x.type === 'day') {
        return '<button class="sr-item" data-act="goto-day" data-day="' + x.d + '"><b>' + esc(x.label) + '</b><small>跳到该天任务</small></button>';
      }
      return '<a class="sr-item" href="' + esc(x.url) + '" target="_blank" rel="noopener"><b>' + esc(x.label) + '</b><small>' + esc(x.sub) + '</small></a>';
    }).join('');
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act], .tab, .week-head');
    if (!t) return;

    if (t.classList.contains('tab')) { go(t.dataset.view); return; }
    if (t.classList.contains('week-head') && t.dataset.act === 'week') {
      var wk = t.closest('.week');
      if (wk) wk.classList.toggle('open');
      return;
    }

    var act = t.dataset.act;
    var d = clamp(S.day, 1, 60);

    if (act === 'toggle') {
      var i = +t.dataset.i;
      var r = ensure(d);
      var k = r.done.indexOf(i);
      if (k >= 0) r.done.splice(k, 1); else r.done.push(i);
      save();
      var li = t.closest('.task');
      if (li) li.classList.toggle('done', r.done.indexOf(i) >= 0);
      updateTodayMeta(d);
      return;
    }
    if (act === 'checkin') {
      var r2 = ensure(d);
      var mi = document.getElementById('mins');
      r2.at = todayISO();
      r2.min = mi ? (+mi.value || 0) : 180;
      save();
      document.getElementById('checkinBox').innerHTML = checkinHTML(d);
      var heat = document.getElementById('heat');
      if (heat) heat.innerHTML = heatHTML();
      updateTodayMeta(d);
      toast('第 ' + d + ' 天打卡完成' + (r2.done.length < DAYS[d - 1].k.length ? '（仍有未勾选任务）' : ''));
      return;
    }
    if (act === 'undo') {
      var r3 = ensure(d);
      r3.at = null;
      save();
      document.getElementById('checkinBox').innerHTML = checkinHTML(d);
      var heat2 = document.getElementById('heat');
      if (heat2) heat2.innerHTML = heatHTML();
      updateTodayMeta(d);
      toast('已撤销打卡');
      return;
    }
    if (act === 'prev' || act === 'next') {
      go('today', d + (act === 'next' ? 1 : -1));
      return;
    }
    if (act === 'jump') { go('today', currentDay()); return; }
    if (act === 'day') { go('today', +t.dataset.day); return; }

    if (act === 'cat') { resCat = t.dataset.cat; renderRes(); return; }
    if (act === 'websearch') {
      var wq = (document.getElementById('webq') || {}).value || '';
      if (!wq.trim()) { toast('先输入关键词'); return; }
      window.open('https://www.bing.com/search?q=' + encodeURIComponent(wq), '_blank', 'noopener');
      return;
    }
    if (act === 'q') {
      var qv = t.dataset.q;
      var inp = document.getElementById('webq');
      if (inp) inp.value = qv;
      renderEngines();
      window.open('https://www.bing.com/search?q=' + encodeURIComponent(qv), '_blank', 'noopener');
      return;
    }

    if (act === 'quiz-start') {
      run = { pool: quizPool(t.dataset.mode), idx: 0, correct: 0, wrong: [], picked: -1, answered: false, mode: t.dataset.mode, logged: false };
      if (!run.pool.length) { run = null; toast('该范围暂无题目'); }
      renderQuizView();
      return;
    }
    if (act === 'quiz-opt' && run && !run.answered) {
      var pick = +t.dataset.i;
      var item = run.pool[run.idx];
      run.picked = pick;
      run.answered = true;
      if (pick === item.a) run.correct++;
      else run.wrong.push(item);
      renderQuizView();
      return;
    }
    if (act === 'quiz-next' && run) {
      run.idx++;
      run.answered = false;
      run.picked = -1;
      renderQuizView();
      return;
    }
    if (act === 'quiz-exit') { run = null; renderQuizView(); return; }

    if (act === 'rub') {
      S.rubric[t.dataset.id] = +t.dataset.v;
      save();
      renderLab();
      return;
    }

    if (act === 'export') { exportJSON(); return; }
    if (act === 'import') { document.getElementById('fileInput').click(); return; }
    if (act === 'print') { window.print(); return; }
    if (act === 'reset') {
      if (confirm('确定清空全部打卡与自测记录？此操作不可恢复，建议先导出备份。')) {
        localStorage.removeItem(KEY);
        S = defaultState();
        S.day = 1;
        render();
        toast('已清空');
      }
      return;
    }
    if (act === 'install') {
      if (window.__deferredPrompt) {
        window.__deferredPrompt.prompt();
        window.__deferredPrompt = null;
      } else {
        toast('请用浏览器菜单里的「添加到主屏幕 / 安装应用」');
      }
      return;
    }
    if (act === 'goto-day') {
      document.getElementById('searchBar').classList.add('hidden');
      go('today', +t.dataset.day);
      return;
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'noteInput') {
      var r = ensure(clamp(S.day, 1, 60));
      r.note = e.target.value;
      clearTimeout(window.__noteT);
      window.__noteT = setTimeout(function () {
        save();
        var st = document.getElementById('noteStatus');
        if (st) { st.textContent = '已保存'; setTimeout(function () { if (st) st.textContent = '自动保存'; }, 1200); }
      }, 400);
      return;
    }
    if (e.target.id === 'searchInput') { doSearch(e.target.value); return; }
    if (e.target.id === 'resq') { renderResList(); return; }
    if (e.target.id === 'webq') { renderEngines(); return; }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'fileInput') {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var data = JSON.parse(fr.result);
          if (!data || data.v !== 1) throw new Error('格式不符');
          S = data;
          S.days = S.days || {};
          S.quiz = S.quiz || { log: [] };
          S.rubric = S.rubric || {};
          save();
          render();
          toast('导入成功');
        } catch (err) { toast('导入失败：文件不是有效的备份'); }
      };
      fr.readAsText(f);
      e.target.value = '';
    }
  });

  document.getElementById('searchToggle').addEventListener('click', function () {
    var bar = document.getElementById('searchBar');
    bar.classList.toggle('hidden');
    if (!bar.classList.contains('hidden')) document.getElementById('searchInput').focus();
  });
  document.getElementById('dataToggle').addEventListener('click', function () {
    go(S.view === 'data' ? 'today' : 'data');
  });

  /* ---------------- 导出 ---------------- */
  function exportJSON() {
    var blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'attack60-备份-' + todayISO() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('已导出备份');
  }

  /* ---------------- 启动 ---------------- */
  if (!S.days[S.day] || !S.days[S.day].at) {
    /* 保持用户当前所在天 */
  } else {
    var cur = currentDay();
    if (cur !== S.day && !(S.days[cur] && S.days[cur].at)) S.day = cur;
  }
  save();
  render();

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__deferredPrompt = e;
  });

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* file:// 或 http 下失败都无所谓 */ });
    });
  }
})();

</script>
</body>
</html>
